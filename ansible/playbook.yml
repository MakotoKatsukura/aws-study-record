---
- name: Deploy Hello AWS application
  hosts: ansible_lab
  become: true
  tasks:
    - name: Install Amazon Corretto 21 headless
      ansible.builtin.dnf:
        name: java-21-amazon-corretto-headless
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/hello-aws
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy Spring Boot application
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../build/libs/hello-aws-0.0.1-SNAPSHOT.jar"
        dest: /opt/hello-aws/hello-aws.jar
        owner: ec2-user
        group: ec2-user
        mode: "0644"
      notify: Restart Hello AWS application

    - name: Install systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/hello-aws.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Hello AWS Spring Boot application
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/opt/hello-aws
          ExecStart=/usr/bin/java -jar /opt/hello-aws/hello-aws.jar
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart Hello AWS application

    - name: Enable and start Hello AWS application
      ansible.builtin.systemd:
        name: hello-aws
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Hello AWS application
      ansible.builtin.systemd:
        name: hello-aws
        state: restarted
        daemon_reload: true
