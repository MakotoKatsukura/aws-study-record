AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation hands-on for VPC, EC2, RDS, and ALB

Parameters: {}

Resources: 
  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

Outputs: {}