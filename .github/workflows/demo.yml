name: Terraform CI and CD
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/demo.yml
      - 03_terraform/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/demo.yml
      - 03_terraform/**
permissions:
  contents: read
jobs:
  terraform-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_terraform
    env:
      TF_VAR_notification_email: test@example.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - name: Initialize Terraform without remote backend
        run: terraform init -backend=false -input=false
      - name: Run infrastructure tests
        run: terraform test
  terraform-deploy:
    needs: terraform-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_terraform
    env:
      TF_VAR_notification_email: ${{ secrets.TF_VAR_NOTIFICATION_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - name: Initialize Terraform with S3 backend
        run: terraform init -input=false
      - name: Create Terraform plan
        run: terraform plan -input=false -out=tfplan
      - name: Apply the Terraform plan
        run: terraform apply -input=false tfplan
