name: Ansible final assignment

on:
  push:
    branches:
      - feature/43-ansible-final-project
    paths:
      - .github/workflows/ansible-final.yml
      - 05_ansible_final/**
      - ansible/playbook.yml
      - build.gradle
      - settings.gradle
      - gradle/**
      - gradlew
      - src/**

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: ap-northeast-1
      TF_IN_AUTOMATION: "true"
      ANSIBLE_HOST_KEY_CHECKING: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Spring Boot application
        run: ./gradlew build --no-daemon

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Check Playbook syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Apply Terraform
        working-directory: 05_ansible_final/terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          echo "app_public_ip=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
          echo "app_security_group_id=$(terraform output -raw app_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"
        id: terraform

      - name: Get runner public IP
        id: runner-ip
        run: echo "cidr=$(curl --fail --silent https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Allow temporary SSH access
        id: ssh-rule
        env:
          SECURITY_GROUP_ID: ${{ steps.terraform.outputs.app_security_group_id }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.cidr }}
        run: |
          rule_id=$(aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key and inventory
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          APP_PUBLIC_IP: ${{ steps.terraform.outputs.app_public_ip }}
        run: |
          key_file="$RUNNER_TEMP/ansible-final-key"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          printf '[ansible_lab]\n%s ansible_user=ec2-user\n' "$APP_PUBLIC_IP" > "$RUNNER_TEMP/ansible-inventory.ini"
          echo "inventory_file=$RUNNER_TEMP/ansible-inventory.ini" >> "$GITHUB_OUTPUT"
        id: ansible-files

      - name: Add EC2 host key
        env:
          APP_PUBLIC_IP: ${{ steps.terraform.outputs.app_public_ip }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          for attempt in {1..12}; do
            if ssh-keyscan -H "$APP_PUBLIC_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              chmod 600 "$HOME/.ssh/known_hosts"
              exit 0
            fi
            sleep 10
          done
          echo "EC2 SSH host key was not available in time" >&2
          exit 1

      - name: Check Ansible connection
        env:
          KEY_FILE: ${{ steps.ansible-files.outputs.key_file }}
          INVENTORY_FILE: ${{ steps.ansible-files.outputs.inventory_file }}
        run: |
          for attempt in {1..12}; do
            if ansible ansible_lab -i "$INVENTORY_FILE" -m ansible.builtin.ping --private-key "$KEY_FILE"; then
              exit 0
            fi
            sleep 10
          done
          echo "Ansible could not connect to EC2 in time" >&2
          exit 1

      - name: Apply Ansible playbook
        env:
          KEY_FILE: ${{ steps.ansible-files.outputs.key_file }}
          INVENTORY_FILE: ${{ steps.ansible-files.outputs.inventory_file }}
        run: ansible-playbook -i "$INVENTORY_FILE" ansible/playbook.yml --private-key "$KEY_FILE"

      - name: Remove temporary SSH access
        if: always() && steps.ssh-rule.outputs.rule_id != ''
        env:
          SECURITY_GROUP_ID: ${{ steps.terraform.outputs.app_security_group_id }}
          SSH_RULE_ID: ${{ steps.ssh-rule.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SSH_RULE_ID"

      - name: Verify temporary SSH access was removed
        if: always() && steps.ssh-rule.outputs.rule_id != ''
        env:
          SECURITY_GROUP_ID: ${{ steps.terraform.outputs.app_security_group_id }}
          SSH_RULE_ID: ${{ steps.ssh-rule.outputs.rule_id }}
        run: |
          rule_count=$(aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=$SECURITY_GROUP_ID" \
            --query "length(SecurityGroupRules[?SecurityGroupRuleId=='$SSH_RULE_ID'])" \
            --output text)
          test "$rule_count" = "0"

      - name: Remove temporary files
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible-final-key" "$RUNNER_TEMP/ansible-inventory.ini"
