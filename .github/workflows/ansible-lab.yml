name: Ansible lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install ansible-core
      - name: Check Playbook syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check