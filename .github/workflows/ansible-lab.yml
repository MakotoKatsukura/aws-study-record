name: Ansible lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install ansible-core
      - name: Check Playbook syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check
      # 既存のActionsワークフローにAWS認証の確認を追加
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      - name: Check AWS authentication
        run: |
          aws sts get-caller-identity > /dev/null
          echo "AWS authentication OK"
      # 対象のセキュリティグループをActionsから参照できるか確認
      - name: Check target security group
        env:
          SECURITY_GROUP_ID: ${{ vars.ANSIBLE_SECURITY_GROUP_ID }}
        run: |
          aws ec2 describe-security-groups \
            --group-ids "$SECURITY_GROUP_ID" \
            --query 'SecurityGroups[].GroupId' \
            --output text

      # runnerの接続元IPだけにSSHを一時許可する
      - name: Get runner public IP
        id: runner-ip
        run: echo "value=$(curl --fail --silent https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Add temporary SSH rule
        id: add-ssh-rule
        env:
          SECURITY_GROUP_ID: ${{ vars.ANSIBLE_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.value }}
        run: |
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      # Secretの秘密鍵をrunner上の一時ファイルに保存する
      - name: Prepare SSH private key
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/ansible-lab-key"
          umask 077
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"
        id: ssh-key

      - name: Add EC2 host key to known_hosts
        env:
          EC2_PUBLIC_IP: ${{ vars.ANSIBLE_EC2_PUBLIC_IP }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$EC2_PUBLIC_IP" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check Ansible connection
        env:
          KEY_FILE: ${{ steps.ssh-key.outputs.key_file }}
        run: ansible ansible_lab -i ansible/inventory.ini -m ansible.builtin.ping --private-key "$KEY_FILE"

      # 実際に変更する前に、変更内容を確認する
      - name: Run Ansible dry run
        env:
          KEY_FILE: ${{ steps.ssh-key.outputs.key_file }}
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key "$KEY_FILE" --check

      - name: Apply Ansible playbook
        env:
          KEY_FILE: ${{ steps.ssh-key.outputs.key_file }}
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key "$KEY_FILE"

      - name: Verify Java version
        env:
          KEY_FILE: ${{ steps.ssh-key.outputs.key_file }}
        run: ansible ansible_lab -i ansible/inventory.ini -m ansible.builtin.command -a "java -version" --private-key "$KEY_FILE"

      # 2回目の実行でchanged=0となり、冪等であることを確認する
      - name: Verify Ansible idempotence
        env:
          KEY_FILE: ${{ steps.ssh-key.outputs.key_file }}
        run: |
          set -o pipefail
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key "$KEY_FILE" | tee "$RUNNER_TEMP/ansible-idempotence.log"
          grep -Eq 'changed=0([[:space:]]|$)' "$RUNNER_TEMP/ansible-idempotence.log"

      # 成功・失敗どちらでも一時ルールを削除する
      - name: Remove temporary SSH rule
        if: always() && steps.add-ssh-rule.outputs.rule_id != ''
        env:
          SECURITY_GROUP_ID: ${{ vars.ANSIBLE_SECURITY_GROUP_ID }}
          SSH_RULE_ID: ${{ steps.add-ssh-rule.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SSH_RULE_ID"

      - name: Verify temporary SSH rule is absent
        if: always() && steps.add-ssh-rule.outputs.rule_id != ''
        env:
          SECURITY_GROUP_ID: ${{ vars.ANSIBLE_SECURITY_GROUP_ID }}
          SSH_RULE_ID: ${{ steps.add-ssh-rule.outputs.rule_id }}
        run: |
          RULE_COUNT=$(aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=$SECURITY_GROUP_ID" \
            --query "length(SecurityGroupRules[?SecurityGroupRuleId=='$SSH_RULE_ID'])" \
            --output text)
          test "$RULE_COUNT" = "0"
          echo "Temporary SSH rule removed"

      - name: Remove temporary SSH private key
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible-lab-key"
